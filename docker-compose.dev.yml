# Development environment - fully self-contained
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# Default credentials (dev only):
#   DB: doci_app / doci_dev_pass
#   API Key: dev-test-key-not-for-production
#   App: http://localhost:8080

services:
  doci:
    build: .
    container_name: doci-dev
    ports:
      - "8080:80"
    environment:
      - DB_HOST=doci-db
      - DB_PORT=5432
      - DB_NAME=doci
      - DB_USER=doci_app
      - DB_PASS=doci_dev_pass
      - DOCI_API_KEY_HASH=  # Set if testing API key auth
      - AI_GATEWAY_URL=https://ai.example.com/api/v1
      - AI_GATEWAY_SSL_VERIFY=true
      - DOCI_DEBUG=true
      - DOCI_DOMAIN=localhost
      - APP_URL=http://localhost:8080
      - AUTH_URL=
      - TZ=UTC
    volumes:
      - ./files:/var/www/html/files
    depends_on:
      doci-db:
        condition: service_healthy
    networks:
      - doci-dev

  doci-db:
    image: postgres:16-alpine
    container_name: doci-db
    environment:
      - POSTGRES_DB=doci
      - POSTGRES_USER=doci_app
      - POSTGRES_PASSWORD=doci_dev_pass
    volumes:
      - doci-pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doci_app -d doci"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - doci-dev

networks:
  doci-dev:

volumes:
  doci-pgdata:
