<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>How it flows</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 22px 26px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-card, #242424);
      color: var(--text-primary, #e0e0e0);
    }
    h2 {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent, #c8a882);
    }
    .lede { margin: 0 0 18px; font-size: 12px; color: var(--text-secondary, #999); }
    svg { width: 100%; height: 220px; }
    .node rect { fill: var(--bg-accent, #2e2e2e); stroke: var(--border, #333); stroke-width: 1; rx: 8; ry: 8; }
    .node text.title { fill: var(--text-white, #f0f0f0); font: 600 13px system-ui; }
    .node text.sub   { fill: var(--text-secondary, #999); font: 11px system-ui; }
    .node.agent rect, .node.human rect { stroke: var(--accent, #c8a882); stroke-width: 1.5; }
    .arrow { stroke: var(--accent, #c8a882); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-label { fill: var(--text-secondary, #999); font: 11px system-ui; }
  </style>
</head>
<body>
  <h2>The loop</h2>
  <p class="lede">Agent writes, DOCI stores and commits, human reads -- in any order. Same operations across UI, MCP, REST, CLI.</p>

  <svg viewBox="0 0 760 220" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M0,0 L0,10 L10,5 z" fill="var(--accent, #c8a882)"/>
      </marker>
    </defs>

    <!-- Agent (left) -->
    <g class="node agent" transform="translate(20, 70)">
      <rect width="150" height="80"/>
      <text class="title" x="75" y="32" text-anchor="middle">AI agent</text>
      <text class="sub"   x="75" y="52" text-anchor="middle">Claude, custom, MCP</text>
    </g>

    <!-- DOCI core (middle) -->
    <g class="node" transform="translate(305, 30)">
      <rect width="150" height="160"/>
      <text class="title" x="75" y="34" text-anchor="middle">DOCI</text>
      <text class="sub"   x="75" y="58"  text-anchor="middle">REST · MCP</text>
      <text class="sub"   x="75" y="76"  text-anchor="middle">git · postgres</text>
      <text class="sub"   x="75" y="100" text-anchor="middle">─────────</text>
      <text class="sub"   x="75" y="120" text-anchor="middle">documents</text>
      <text class="sub"   x="75" y="138" text-anchor="middle">threads · versions</text>
    </g>

    <!-- Human (right) -->
    <g class="node human" transform="translate(590, 70)">
      <rect width="150" height="80"/>
      <text class="title" x="75" y="32" text-anchor="middle">You</text>
      <text class="sub"   x="75" y="52" text-anchor="middle">browser, on your VPN</text>
    </g>

    <!-- agent -> doci (top) -->
    <path class="arrow" d="M 170 100 C 220 100, 270 70, 305 60"/>
    <text class="arrow-label" x="237" y="68" text-anchor="middle">writes report</text>

    <!-- doci -> human (top) -->
    <path class="arrow" d="M 455 60 C 500 70, 540 90, 590 100"/>
    <text class="arrow-label" x="523" y="68" text-anchor="middle">link to read</text>

    <!-- human -> doci (bottom) -->
    <path class="arrow" d="M 590 130 C 545 145, 500 170, 455 165"/>
    <text class="arrow-label" x="523" y="180" text-anchor="middle">thread on quote</text>

    <!-- doci -> agent (bottom) -->
    <path class="arrow" d="M 305 165 C 260 170, 215 145, 170 130"/>
    <text class="arrow-label" x="237" y="180" text-anchor="middle">picks it up</text>
  </svg>
</body>
</html>
