<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yields snapshot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-card, #242424);
      color: var(--text-primary, #e0e0e0);
    }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .kpi { background: var(--bg-accent, #2e2e2e); border: 1px solid var(--border, #333); border-radius: 6px; padding: 10px 12px; }
    .kpi-label { font-size: 10px; color: var(--text-secondary, #999); text-transform: uppercase; letter-spacing: .05em; }
    .kpi-value { font-size: 19px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; color: var(--text-white, #f0f0f0); }
    .kpi-sub { font-size: 10px; color: var(--text-secondary, #999); margin-top: 2px; }
    .kpi-sub.up { color: var(--ok, #81c784); }
    .kpi-sub.down { color: var(--error, #e57373); }

    .chart-title { font-size: 11px; color: var(--text-secondary, #999); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; }
    .chart { display: grid; grid-template-columns: 100px 1fr 50px; gap: 8px; align-items: center; font-size: 12px; }
    .chart-label { color: var(--text-primary, #e0e0e0); }
    .chart-bar { background: var(--bg-accent, #2e2e2e); border-radius: 3px; height: 10px; overflow: hidden; }
    .chart-bar > div { height: 100%; background: var(--accent, #c8a882); }
    .chart-num { text-align: right; color: var(--text-secondary, #999); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="row">
    <div class="kpi">
      <div class="kpi-label">CSA shares</div>
      <div class="kpi-value">84 / 84</div>
      <div class="kpi-sub up">target met</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Dairy / week</div>
      <div class="kpi-value">560 gal</div>
      <div class="kpi-sub up">+4% vs 2025</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Sales YTD</div>
      <div class="kpi-value">$28,420</div>
      <div class="kpi-sub up">+18%</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Open positions</div>
      <div class="kpi-value">2</div>
      <div class="kpi-sub">need by Jun 1</div>
    </div>
  </div>

  <p class="chart-title">Dairy gallons by month (2026)</p>
  <div class="chart">
    <div class="chart-label">January</div>
    <div class="chart-bar"><div style="width:78%"></div></div>
    <div class="chart-num">2,180</div>

    <div class="chart-label">February</div>
    <div class="chart-bar"><div style="width:80%"></div></div>
    <div class="chart-num">2,260</div>

    <div class="chart-label">March</div>
    <div class="chart-bar"><div style="width:100%"></div></div>
    <div class="chart-num">2,810</div>

    <div class="chart-label">April</div>
    <div class="chart-bar"><div style="width:80%"></div></div>
    <div class="chart-num">2,240</div>

    <div class="chart-label">May (partial)</div>
    <div class="chart-bar"><div style="width:60%"></div></div>
    <div class="chart-num">1,680</div>
  </div>
</body>
</html>
