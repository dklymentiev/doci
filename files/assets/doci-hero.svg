<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="DOCI — document workspace for AI agents">
  <!-- Brand canvas — same slate-900 as the body background so the hero blends edge-to-edge. -->
  <rect width="800" height="450" fill="#0f172a"/>

  <!-- Scattered translucent documents (background pattern). -->
  <g opacity="0.15">
    <g transform="translate(20,20) rotate(-12)">
      <rect width="130" height="160" rx="5" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
      <line x1="16" y1="26"  x2="90"  y2="26"  stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="16" y1="42"  x2="105" y2="42"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="16" y1="58"  x2="80"  y2="58"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="16" y1="74"  x2="95"  y2="74"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="16" y1="90"  x2="85"  y2="90"  stroke="#94a3b8" stroke-width="2"/>
    </g>
    <g transform="translate(610,10) rotate(10)">
      <rect width="145" height="175" rx="5" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
      <line x1="18" y1="28"  x2="100" y2="28"  stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="18" y1="46"  x2="118" y2="46"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="18" y1="64"  x2="90"  y2="64"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="18" y1="82"  x2="110" y2="82"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="18" y1="100" x2="80"  y2="100" stroke="#94a3b8" stroke-width="2"/>
      <line x1="18" y1="118" x2="100" y2="118" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <g transform="translate(0,250) rotate(7)">
      <rect width="135" height="170" rx="5" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
      <line x1="18" y1="28"  x2="90"  y2="28"  stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="18" y1="46"  x2="108" y2="46"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="18" y1="64"  x2="85"  y2="64"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="18" y1="82"  x2="100" y2="82"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="18" y1="100" x2="95"  y2="100" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <g transform="translate(640,270) rotate(-12)">
      <rect width="125" height="160" rx="5" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
      <line x1="16" y1="26"  x2="85"  y2="26"  stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="16" y1="44"  x2="100" y2="44"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="16" y1="62"  x2="78"  y2="62"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="16" y1="80"  x2="95"  y2="80"  stroke="#94a3b8" stroke-width="2"/>
      <line x1="16" y1="98"  x2="82"  y2="98"  stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>
  <g opacity="0.1">
    <g transform="translate(160,160) rotate(-6)">
      <rect width="115" height="145" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
      <line x1="14" y1="22" x2="80" y2="22" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="14" y1="38" x2="92" y2="38" stroke="#94a3b8" stroke-width="2"/>
      <line x1="14" y1="54" x2="75" y2="54" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <g transform="translate(555,140) rotate(16)">
      <rect width="105" height="135" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
      <line x1="14" y1="22" x2="75" y2="22" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="14" y1="38" x2="85" y2="38" stroke="#94a3b8" stroke-width="2"/>
      <line x1="14" y1="54" x2="70" y2="54" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>
  <g opacity="0.12">
    <g transform="translate(340,330) rotate(-8)">
      <rect width="125" height="155" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
      <line x1="16" y1="26" x2="85"  y2="26" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="16" y1="44" x2="100" y2="44" stroke="#94a3b8" stroke-width="2"/>
      <line x1="16" y1="62" x2="80"  y2="62" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <g transform="translate(340,-30) rotate(5)">
      <rect width="110" height="140" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
      <line x1="14" y1="22" x2="78" y2="22" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="14" y1="38" x2="90" y2="38" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>

  <!-- Central icon — document with colored bullet rows + a thread-branch.
       Original viewBox 180x210, scaled to 280x326, centered. -->
  <g transform="translate(260,62) scale(1.5555)" filter="url(#shadow)">
    <rect x="10" y="5" width="160" height="200" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="32" y1="26" x2="32" y2="174" stroke="#334155" stroke-width="2"/>
    <circle cx="32" cy="30"  r="5" fill="#22c55e"/>
    <line   x1="44" y1="30"  x2="130" y2="30"  stroke="#334155" stroke-width="1.5"/>
    <circle cx="32" cy="65"  r="5" fill="#3b82f6"/>
    <line   x1="44" y1="65"  x2="115" y2="65"  stroke="#334155" stroke-width="1.5"/>
    <circle cx="32" cy="100" r="5" fill="#a855f7"/>
    <line   x1="44" y1="100" x2="140" y2="100" stroke="#334155" stroke-width="1.5"/>
    <circle cx="32" cy="135" r="5" fill="#22c55e"/>
    <line   x1="44" y1="135" x2="125" y2="135" stroke="#334155" stroke-width="1.5"/>
    <circle cx="32" cy="170" r="5" fill="#f59e0b"/>
    <line   x1="44" y1="170" x2="120" y2="170" stroke="#334155" stroke-width="1.5"/>
    <!-- thread branch -->
    <line   x1="37" y1="130" x2="55" y2="112" stroke="#334155" stroke-width="2"/>
    <line   x1="55" y1="112" x2="55" y2="77"  stroke="#334155" stroke-width="2"/>
    <circle cx="55" cy="112" r="5" fill="#22c55e"/>
    <circle cx="55" cy="77"  r="5" fill="#3b82f6"/>
  </g>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.8"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
